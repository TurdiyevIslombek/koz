# Ko'z behind HTTPS (deploy/install.sh step 6). The web app listens only on 127.0.0.1:4173.
server {
    listen 80 default_server;
    server_name __IP__;

    location /.well-known/acme-challenge/ {
        root /var/www/koz-acme;          # certificate renewal (every few days)
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;   # Ubuntu 24.04 ships Nginx 1.24 (the separate http2 directive needs 1.25+)
    server_name __IP__;

    ssl_certificate     /etc/letsencrypt/live/__IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;            # commands and logins are small; no uploads exist
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log off;                      # no request logs (rule 12); errors only

    # The runner's outbound WebSocket (contract section 5): one long-lived connection.
    location = /v1/runner {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The live event stream to browsers (server-sent events): never buffered.
    location /api/events {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
